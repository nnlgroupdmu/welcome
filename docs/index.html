<!DOCTYPE html>
<html lang="cn">

<head>
  <meta charset="UTF-8">
  <title>NNL Group Open Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="_media/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="_media/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="_media/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="_media/favicon-16x16.png">
  <link rel="manifest" href="_media/site.webmanifest">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* 基础链接样式 */
    .sidebar-nav li a[href*="grafana"] {
      padding-right: 60px !important;
      position: relative;
      display: block;
      /* 确保链接撑满整行，让定位更准 */
    }

    /* 标签样式优化 */
    .sidebar-nav li a[href*="grafana"]::after {
      color: #ffffff;
      content: "● LIVE";
      font-size: 9px;
      /* 稍微调小一点，更精致 */
      font-weight: bold;

      display: inline-block;
      vertical-align: middle;
      /* 关键：通过左边距控制与标题的距离 */
      margin-left: 10px;
      /* 关键：通过负的 margin 抵消对行高的影响 */
      margin-top: -2px;

      background-color: #fd9099;
      padding: 1px 4px;
      /* 减小内边距 */
      border-radius: 4px;
      line-height: 1.2;
      /* 锁定标签内部行高 */
      white-space: nowrap;
      /* ... 保持上面的代码不变 ... */
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.6;
      }

      100% {
        opacity: 1;
      }
    }
      /* 1. 强行重置 Docsify 对首页超链接和文本的全局污染 */
    .portal-grid a.portal-card, 
    .portal-grid a.portal-card:hover {
      color: #2c3e50 !important;
      text-decoration: none !important;
      border-bottom: 1px solid #e1e4e8 !important; /* 防止Docsify强加下划线 */
    }

    /* 2. 强行纠正卡片内段落的行高和边距 */
    .portal-card .card-content p,
    .portal-card p {
      margin: 0 0 16px 0 !important;
      padding: 0 !important;
      line-height: 1.6 !important;
      color: #6a737d !important;
    }

    /* 3. 强行重置标题 */
    .portal-card h4 {
      margin: 0 0 8px 0 !important;
      font-size: 18px !important;
      font-weight: 600 !important;
      color: #2c3e50 !important;
      border-bottom: none !important; /* 防止Docsify把h4当成文档标题加下划线 */
    }
  </style>

</head>

<body>

  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '实验室在线文档',
      repo: 'https://github.com/nnlgroupdmu/welcome',
      // homepage: 'README.md',
      subMaxLevel: 3, // 抓取正文中的标题显示在侧边栏
      auto2top: true, // 切换页面后自动回到顶部
      loadSidebar: true,
      coverpage: true,
      executeScript: true, // 允许在 Markdown 中执行脚本
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索指南内容...',
        noData: '找不到结果',
        depth: 6
      },
      flexibleAlerts: {
        style: 'flat' // 推荐使用 flat 或 callout 风格，看起来非常专业
      },
      giscus: {
        repo: "nnlgroupdmu/welcome",
        repoId: "R_kgDOR2368A",
        category: "General",
        categoryId: "DIC_kwDOR2368M4C60PL",
        mapping: "pathname",
        reactionsEnabled: "1",
        strict: "0",
        emitMetadata: "0",
        inputPosition: "bottom",
        theme: "preferred_color_scheme",
        lang: "zh-CN",
        loading: "lazy"
      },
      plugins: [
        function (hook, vm) {
          hook.doneEach(function () {
            // 定义你不想要评论区的页面路径
            var blacklist = ['/', '/README','/inter_navi'];

            var path = vm.route.path;
            var giscusContainer = document.querySelector('.giscus');

            if (blacklist.indexOf(path) !== -1) {
              // 如果在黑名单里，直接隐藏或移除
              if (giscusContainer) {
                giscusContainer.style.display = 'none';
              }
            } else {
              // 如果不在黑名单，确保它是显示的
              if (giscusContainer) {
                giscusContainer.style.display = 'block';
              }
            }
          });
        }
      ]
    }
  </script>
  <!-- giscus评论  -->
  <link rel="stylesheet" href="https://unpkg.com/docsify-giscus@1.0.0/dist/giscus.css">
  <script src="https://unpkg.com/docsify-giscus@1.0.0/dist/docsify-giscus.min.js"></script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!--在所有的代码块上添加一个简单的Click to copy按钮来允许用户从你的文档中轻易地复制代码-->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- magic quote block -->
  <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>
</body>

</html>
